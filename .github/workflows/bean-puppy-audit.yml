name: BEAN Puppy-adjacent evidence audit

on:
  workflow_dispatch:
  push:
    paths:
      - "src/venvwin/puppy_evidence.py"
      - "src/venvwin/bootstate.py"
      - "venvwin-portable/build-iso.sh"
      - "venvwin-portable/build-flash-ready-standard.sh"
      - "tests/test_puppy_evidence.py"
      - "tests/test_puppy_bootstate_evidence.py"
      - ".github/workflows/bean-puppy-audit.yml"

jobs:
  puppy-readiness-evidence:
    name: BEAN Bridge Puppy audit (no ISO build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out exact BEAN Bridge compiler revision
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: d1bd5a30c89de99455a436a57d66e064f34fe709
          path: bean-bridge

      - name: Validate source and evidence tests
        env:
          PYTHONPATH: src
        run: |
          python -m pip install pytest
          python -m compileall -q src tests
          python -m pytest -q tests/test_puppy_evidence.py tests/test_puppy_bootstate_evidence.py

      - name: Collect actual repository observations
        env:
          PYTHONPATH: src
        run: |
          python -m venvwin.puppy_evidence --root . --out dist/puppy-architecture-report.json

      - name: Run BEAN Bridge's five-fold SQLite replay
        run: |
          set +e
          PYTHONPATH=bean-bridge/src python -m ezbean.smoke_lab \
            --report dist/puppy-architecture-report.json \
            --phase puppy \
            --ledger dist/puppy-bean-evidence.sqlite \
            --receipt dist/puppy-bean-receipt.json \
            --repeat 5
          outcome=$?
          set -e
          # This pre-alpha feature is intentionally NOT READY.
          # An exit 1 is expected when live mounts/reboot/SFS evidence is missing.
          # A false "PASS" would instead fail the audit workflow.
          test "$outcome" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("dist/puppy-bean-receipt.json").read_text())
          checks = receipt["checks"]
          assert receipt["phase"] == "puppy"
          assert receipt["verdict"] == "FAIL"
          assert receipt["repetitions"] == 5
          assert receipt["required"] == 6
          assert checks["kernel_source_guard"]["status"] == "pass"
          assert checks["lean_core_package_boundary"]["status"] == "pass"
          assert all(checks[x]["status"] != "pass" for x in (
              "runtime_overlay", "ram_copy_verified", "persistence_reboot", "external_app_modules"
          ))
          print("BEAN PUPPY AUDIT: source gates pass; 4 runtime/product capabilities unverified")
          PY

      - name: Publish BEAN evidence artifacts (no ISO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-puppy-architecture-receipts
          path: |
            dist/puppy-architecture-report.json
            dist/puppy-bean-receipt.json
            dist/puppy-bean-evidence.sqlite
          if-no-files-found: warn
