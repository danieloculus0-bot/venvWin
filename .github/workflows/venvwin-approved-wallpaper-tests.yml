name: Approved venvWin wallpaper and ROX permanence checks
on:
  push:
    branches: [feat/restore-original-venvwin-splash-20261013]
    paths:
      - .github/workflows/venvwin-approved-wallpaper-tests.yml
      - puppy-native/build-puppy.sh
      - puppy-native/venvwin-session
      - puppy-native/venvwin-wallpaper-apply
      - puppy-native/art/venvwin-amber-arc.webp.b64
      - tests/test_puppy_wallpaper_permanence.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-approved-asset:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual ROX pinboard rewriting, Puppy build and exact source
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/test_puppy_wallpaper_permanence.py
          sh -n puppy-native/venvwin-wallpaper-apply
          sh -n puppy-native/venvwin-session
          bash -n puppy-native/build-puppy.sh
          test -s puppy-native/art/venvwin-amber-arc.webp.b64 || {
            echo "APPROVED_WALLPAPER_NOT_COMMITTED_NO_FALSE_PASS"; exit 1;
          }
          base64 -d puppy-native/art/venvwin-amber-arc.webp.b64 > /tmp/venvwin-amber-arc.webp
          printf '%s  %s\n' '6187575271bf955ba4daaca6db01f168fdead49b4abce22c7f3275a1b004b6ab' '/tmp/venvwin-amber-arc.webp' | sha256sum -c -
          echo APPROVED_VENVWIN_IMAGE_AND_ROX_SOURCE_GATES_PASS_GUEST_REBOOT_NOT_TESTED
