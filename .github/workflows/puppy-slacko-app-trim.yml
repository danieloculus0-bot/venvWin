name: Measured Slacko-style app trim on isolated original Puppy copy
on:
  push:
    branches: [feat/puppy-slacko-app-optimization-20261013]
    paths:
      - .github/workflows/puppy-slacko-app-trim.yml
      - puppy-native/optimize-slacko-apps.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-isolated-app-trim:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check trimmer syntax and install extraction tools
        run: |
          set -euo pipefail
          python3 -m py_compile puppy-native/optimize-slacko-apps.py
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends squashfs-tools xorriso
      - name: Verify original upstream ISO checksum BEFORE extracting
        run: |
          set -euo pipefail
          mkdir -p dist/slacko-app-trim
          curl --fail --location --retry 3 --max-time 1100 \
            -o dist/slacko-app-trim/BookwormPup64_10.0.12.iso \
            https://distro.ibiblio.org/puppylinux/puppy-bookwormpup/BookwormPup64/10.0.12/BookwormPup64_10.0.12.iso
          printf '%s  %s\n' 'ae65f6e6d70a96f48bdbb291c2426f8a2fd77a73692e149e81a5eecb6fe7509f' \
            dist/slacko-app-trim/BookwormPup64_10.0.12.iso | sha256sum -c -
          echo UPSTREAM_ISO_CHECKSUM_VERIFIED_NOT_COMPATIBILITY_PROOF
      - name: Extract only main squashfs from unchanged ISO
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/slacko-app-trim"
          mkdir -p "$OUT/extracted-iso"
          xorriso -osirrox on \
            -indev "$OUT/BookwormPup64_10.0.12.iso" \
            -extract /puppy_dpupbw64_10.0.12.sfs "$OUT/extracted-iso/original-main.sfs" \
            >"$OUT/original-sfs-extraction.log" 2>&1
          test -s "$OUT/extracted-iso/original-main.sfs"
          unsquashfs -s "$OUT/extracted-iso/original-main.sfs" > "$OUT/original-sfs-format.txt"
          echo VERIFIED_MAIN_SFS_PRESENCE_NOT_GUEST_BOOT
      - name: Unpack temporary SquashFS preserving device node ownership
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/slacko-app-trim"
          sudo unsquashfs -d "$OUT/work-root" "$OUT/extracted-iso/original-main.sfs" \
            > "$OUT/unsquashfs.log" 2>&1
          test -e "$OUT/work-root/usr/share/applications/gnumeric.desktop"
          test -e "$OUT/work-root/usr/bin/abiword"
          test -e "$OUT/work-root/usr/bin/gnumeric"
          echo ORIGINAL_SYSTEM_UNPACKED_TEST_COPY_ONLY
      - name: Safely prune only exact app-specific targets in test copy and measure
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/slacko-app-trim"
          sudo python3 puppy-native/optimize-slacko-apps.py "$OUT/work-root" \
            --report "$OUT/plan.json"
          sudo python3 puppy-native/optimize-slacko-apps.py "$OUT/work-root" \
            --report "$OUT/trim-application-plan.json" --apply
          for p in \
            usr/bin/gnumeric usr/bin/abiword usr/bin/ssconvert \
            usr/bin/jwm usr/local/bin/rox usr/local/bin/frisbee \
            usr/bin/connman-gtk usr/bin/mpv usr/bin/smplayer \
            usr/bin/aplay usr/bin/pipewire; do
            test -e "$OUT/work-root/$p" || test -L "$OUT/work-root/$p" || exit 2
          done
          test ! -e "$OUT/work-root/usr/bin/mhwaveedit"
          test ! -e "$OUT/work-root/opt/deadbeef"
          test -s "$OUT/trim-application-plan.json"
          echo FIRST_PASS_REMOVAL_COMPLETE_OFFICE_NETWORK_AND_SYSTEM_PROTECTED
          python3 - "$OUT/work-root" "$OUT/default-handler-review.txt" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          lines=[]
          for stem in ('defaultaudioplayer','defaultaudioeditor','defaultmediaplayer','defaultcdplayer'):
            for prefix in ('usr/bin','usr/local/bin'):
              path=root/prefix/stem
              if path.is_symlink():
                lines.append(f'{prefix}/{stem} -> {path.readlink()}')
              elif path.is_file():
                if path.stat().st_size < 8192:
                  try:
                    data=path.read_text(errors='replace')
                    lines.append(f'{prefix}/{stem}: {data[:1200]!r}')
                  except Exception as exc:
                    lines.append(f'{prefix}/{stem}: UNREADABLE {exc}')
                else:
                  lines.append(f'{prefix}/{stem}: LARGE_OR_BINARY')
              else:
                lines.append(f'{prefix}/{stem}: NOT_PRESENT')
          pathlib.Path(sys.argv[2]).write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Recompress test system and inspect measured difference (NO release)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dist/slacko-app-trim"
          sudo mksquashfs "$OUT/work-root" "$OUT/opt-main.sfs" -noappend \
            -comp zstd -Xcompression-level 19 -b 262144 -no-exports -no-xattrs -processors 4 \
            >"$OUT/recompress.log" 2>&1
          unsquashfs -s "$OUT/opt-main.sfs" >"$OUT/optimized-sfs-format.txt"
          unsquashfs -ll "$OUT/opt-main.sfs" > "$OUT/optimized-inventory.txt"
          for name in abiword gnumeric ssconvert jwm smplayer mpv; do
            grep -Fq "squashfs-root/usr/bin/$name" "$OUT/optimized-inventory.txt" || {
              echo "OPTIMIZED_SFS_PROTECTED_APP_MISSING=$name"; exit 2;
            }
          done
          ORIG=$(stat -c %s "$OUT/extracted-iso/original-main.sfs")
          NEW=$(stat -c %s "$OUT/opt-main.sfs")
          python3 - "$ORIG" "$NEW" "$OUT/app-trim-size.txt" <<'PY'
          import sys
          old,new=int(sys.argv[1]),int(sys.argv[2])
          with open(sys.argv[3],"w") as f:
            f.write(f"original_main_sfs_bytes={old}\ntrimmed_main_sfs_bytes={new}\ncompressed_delta_bytes={old-new}\n")
          print(f"MEASURED_MAIN_SFS_BEFORE={old}")
          print(f"MEASURED_MAIN_SFS_AFTER={new}")
          print(f"MEASURED_COMPRESSED_SFS_BYTES_SAVED={old-new}")
          if new >= old:
            raise SystemExit("NOT_A_SMALLER_SFS_DO_NOT_PROMOTE")
          PY
          xorriso -indev "$OUT/BookwormPup64_10.0.12.iso" \
            -outdev "$OUT/isolated-test-apptrim.iso" \
            -map "$OUT/opt-main.sfs" /puppy_dpupbw64_10.0.12.sfs \
            -boot_image any replay -commit >"$OUT/test-iso-build.log" 2>&1
          xorriso -indev "$OUT/isolated-test-apptrim.iso" \
            -report_el_torito plain >"$OUT/test-boot-catalog.txt" 2>&1
          grep -qi 'El Torito' "$OUT/test-boot-catalog.txt"
          sha256sum "$OUT/isolated-test-apptrim.iso" "$OUT/opt-main.sfs" > "$OUT/experimental-hashes.txt"
          # Confirm the real APT/dpkg database, browser, firmware and hardware
          # modules are byte-identical between upstream and trimmed ISO.
          for module in \
            bdrv_dpupbw64_10.0.12.sfs \
            adrv_dpupbw64_10.0.12.sfs \
            fdrv_dpupbw64_10.0.12.sfs \
            zdrv_dpupbw64_10.0.12.sfs; do
            xorriso -osirrox on -indev "$OUT/isolated-test-apptrim.iso" \
              -extract "/$module" "$OUT/verify-$module" \
              >>"$OUT/retained-layers.log" 2>&1
            xorriso -osirrox on -indev "$OUT/BookwormPup64_10.0.12.iso" \
              -extract "/$module" "$OUT/original-$module" \
              >>"$OUT/retained-layers.log" 2>&1
            cmp "$OUT/original-$module" "$OUT/verify-$module" || {
              echo "PROTECTED_PUPPY_LAYER_MODIFIED=$module"; exit 3;
            }
            sha256sum "$OUT/original-$module" "$OUT/verify-$module" >> "$OUT/retained-layers-sha256.txt"
            rm -f "$OUT/original-$module" "$OUT/verify-$module"
            echo "PROTECTED_PUPPY_LAYER_BYTE_IDENTICAL=$module"
          done
          echo ISOLATED_TRIMMED_BOOT_STRUCTURE_CREATED_NOT_PUPPY_OR_WINE_GUEST_VERIFIED
      - name: Upload measured application-trim evidence (NEVER ISO or SFS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy1012-measured-app-trim-evidence-no-iso
          retention-days: 21
          if-no-files-found: warn
          path: |
            dist/slacko-app-trim/plan.json
            dist/slacko-app-trim/trim-application-plan.json
            dist/slacko-app-trim/app-trim-size.txt
            dist/slacko-app-trim/original-sfs-format.txt
            dist/slacko-app-trim/optimized-sfs-format.txt
            dist/slacko-app-trim/test-boot-catalog.txt
            dist/slacko-app-trim/experimental-hashes.txt
            dist/slacko-app-trim/unsquashfs.log
            dist/slacko-app-trim/recompress.log
            dist/slacko-app-trim/default-handler-review.txt
            dist/slacko-app-trim/test-iso-build.log
            dist/slacko-app-trim/retained-layers.log
            dist/slacko-app-trim/retained-layers-sha256.txt
