name: Puppy orange UI and Wine integration source audit

on:
  push:
    branches:
      - feat/puppy-ui-wine-integration-20261011
    paths:
      - "puppy-native/**"
      - "src/venvwin/**"
      - "tests/**"
      - ".github/workflows/puppy-ui-wine-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run venvWin source tests, NO image build
        run: |
          python -m pip install -e . pytest
          python -m pytest -q
          bash -n puppy-native/build-puppy.sh
          for file in puppy-native/venvwin-session puppy-native/venvwin-wine puppy-native/venvwin-control-center puppy-native/venvwin-theme-apply; do
            sh -n "$file"
          done
          echo 'PUPPY_ORANGE_UI_WINE_SOURCE_CHECK_PASS (NOT GUEST EVIDENCE)'
