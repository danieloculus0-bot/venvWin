name: Puppy Emperor Gauntlet core ISO candidate

# One-time push trigger keyed to the deliberate release request file.
# Ordinary commits never launch this expensive full ISO/QEMU experiment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "venvwin-portable/REQUEST_EMPEROR_CORE_ISO_20261020.md"

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Core ISO, actual SquashFS, QEMU guest evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker engine
        run: |
          docker --version
          docker info >/dev/null

      - name: Build actual live ISO and verify it
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            debian:bookworm bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-venv python3-pip python3-full \
                live-build sudo git rsync xorriso \
                grub-pc-bin grub-efi-amd64-bin grub-common \
                mtools dosfstools squashfs-tools qemu-system-x86 \
                curl ca-certificates wget gzip file
              git config --global --add safe.directory /workspace
              python3 -m venv /tmp/venvwin-qa
              /tmp/venvwin-qa/bin/python -m pip install -e . pytest
              export PATH="/tmp/venvwin-qa/bin:$PATH"
              python -m pytest tests/test_emperor_gauntlet_bundle.py -q
              bash ./venvwin-portable/build-emperor-core.sh
            '

      - name: Upload build and boot evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy-venvwin-emperor-core-candidate
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/venvwin-portable-alpha-core.iso
            dist/venvwin-portable-alpha-core.iso.sha256
            dist/venvwin-portable-alpha-core-manifest.txt
            dist/venvwin-emperor-core-verdict.txt
            dist/venvwin-emperor-core-iso-list.txt
            dist/venvwin-emperor-core-squashfs-list.txt
            dist/venvwin-emperor-core-qemu-serial.log

      - name: Enforce actual guest boot, distinguish gameplay
        if: always()
        shell: bash
        run: |
          test -f dist/venvwin-emperor-core-verdict.txt
          grep -Fxq 'stage=GUEST_BOOT_PASS' dist/venvwin-emperor-core-verdict.txt
          grep -Fxq 'status=BOOT_VERIFIED_GAMEPLAY_UNTESTED' dist/venvwin-emperor-core-verdict.txt
          echo 'Core ISO boot evidence exists. Interactive game gameplay remains a separate validation gate.'
